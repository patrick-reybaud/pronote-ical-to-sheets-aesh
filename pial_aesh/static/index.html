<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>PIAL — Affectation des AESH</title>
<style>
:root{--bleu:#2b5a8a;--bleu-clair:#e8f0f8;--gris:#f5f6f7;--bord:#d3d7dc;--texte:#1f2933;
      --vert:#2f7d4f;--orange:#b26b00;--rouge:#b3261e;--jaune:#fffbe6}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
     font-size:14px;color:var(--texte);background:var(--gris)}
header{background:var(--bleu);color:#fff;padding:10px 18px;display:flex;align-items:center;gap:16px}
header h1{font-size:16px;margin:0;font-weight:600}
header .projet{margin-left:auto;font-size:13px;opacity:.9}
.corps{display:flex;min-height:calc(100vh - 42px)}
nav{width:210px;background:#fff;border-right:1px solid var(--bord);padding:10px 0;flex-shrink:0}
nav button{display:block;width:100%;text-align:left;padding:9px 16px;border:0;background:none;
           cursor:pointer;font-size:13.5px;color:var(--texte);border-left:3px solid transparent}
nav button:hover{background:var(--gris)}
nav button.actif{background:var(--bleu-clair);border-left-color:var(--bleu);font-weight:600}
nav button:disabled{opacity:.38;cursor:not-allowed}
nav .num{display:inline-block;width:20px;color:#8a929b;font-variant-numeric:tabular-nums}
main{flex:1;padding:20px 26px;max-width:1500px}
h2{margin:0 0 4px;font-size:19px}
.aide{color:#5b6570;margin:0 0 18px;max-width:900px;line-height:1.5}
.carte{background:#fff;border:1px solid var(--bord);border-radius:6px;padding:16px;margin-bottom:16px}
.depot{border:2px dashed var(--bord);border-radius:8px;padding:26px;text-align:center;background:#fff;
       cursor:pointer;transition:.15s}
.depot:hover,.depot.survol{border-color:var(--bleu);background:var(--bleu-clair)}
.depot b{display:block;font-size:15px;margin-bottom:4px}
.depot span{color:#5b6570;font-size:13px}
button.action{background:var(--bleu);color:#fff;border:0;border-radius:5px;padding:9px 16px;
              font-size:14px;cursor:pointer}
button.action:hover{background:#1e4570}
button.action:disabled{background:#9aa5b1;cursor:not-allowed}
button.secondaire{background:#fff;color:var(--bleu);border:1px solid var(--bleu)}
button.secondaire:hover{background:var(--bleu-clair)}
table{border-collapse:collapse;width:100%;background:#fff;font-size:13px}
th,td{border:1px solid var(--bord);padding:5px 8px;text-align:left}
th{background:#eef1f4;font-weight:600;position:sticky;top:0;z-index:2;
   box-shadow:inset 0 -1px 0 var(--bord)}
tr:hover td{background:#fafbfc}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.pastille{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11.5px;font-weight:600}
.ok{background:#dcf0e3;color:var(--vert)}.attention{background:#fdeccd;color:var(--orange)}
.ko{background:#fbdedc;color:var(--rouge)}.neutre{background:#e8eaed;color:#4a5258}
.msg{padding:10px 14px;border-radius:5px;margin-bottom:12px;line-height:1.45}
.msg.err{background:#fbdedc;border-left:3px solid var(--rouge)}
.msg.avert{background:#fdeccd;border-left:3px solid var(--orange)}
.msg table{font-size:12.5px}.msg th{background:rgba(0,0,0,.06)}
.msg td,.msg th{border-color:rgba(0,0,0,.15)}
details summary::marker{color:var(--bleu)}
.voile{position:fixed;inset:0;background:rgba(20,26,33,.45);display:flex;align-items:center;
       justify-content:center;z-index:50}
.fenetre{background:#fff;border-radius:8px;padding:20px 22px;width:min(760px,92vw);
         box-shadow:0 12px 40px rgba(0,0,0,.28)}
.fenetre h3{font-size:17px}
.msg.info{background:var(--bleu-clair);border-left:3px solid var(--bleu)}
.msg.succes{background:#dcf0e3;border-left:3px solid var(--vert)}
.note{width:38px;text-align:center;border:1px solid var(--bord);border-radius:3px;padding:2px;
      background:var(--jaune);font-size:13px}
.note.vide{background:#fff;color:#aeb4bb}
.note.defaut{background:#fff;color:#8a929b}
.note.exclu{background:#f0f1f2;color:#8a929b;text-decoration:line-through}
.exclusions{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.exclusions label{border:1px solid var(--bord);border-radius:4px;padding:4px 9px;
  font-size:12.5px;cursor:pointer;background:#fff;display:flex;gap:6px;align-items:center}
.exclusions label.retiree{background:#f0f1f2;color:#8a929b;text-decoration:line-through}
.note.defaut::placeholder{color:#b8bdc4;opacity:1}
.heures{width:52px;text-align:right;border:1px solid var(--bord);border-radius:3px;padding:2px;
        background:var(--jaune);font-size:13px}
.detail{font-size:12.5px;color:#4a5258;margin-top:10px;line-height:1.6}
.detail code{background:var(--gris);padding:1px 5px;border-radius:3px}
/* Pas d'ascenseur à l'intérieur des cartes : un tableau s'affiche en entier et c'est la page qui
   défile. Seuls les tableaux trop larges pour l'écran (efforts par matière, tableau croisé) gardent
   un défilement horizontal, faute de quoi ils déborderaient. Les en-têtes restent collés en haut. */
.defile{border:1px solid var(--bord);border-radius:5px;overflow:visible}
.defile.large{overflow-x:auto}
.defile table{border-radius:5px}
.grille-dispo td{padding:0;text-align:center;width:52px;height:19px;cursor:pointer;user-select:none}
.grille-dispo td.libre{background:#fff}
.grille-dispo td.pris{background:#cce8cc}
.grille-dispo td.heure{background:#f4f4f4;font-size:11px;width:88px;cursor:default;font-weight:600}
.ligne{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.ligne label{font-size:13px;color:#4a5258}
select,input[type=text],input[type=number]{padding:5px 7px;border:1px solid var(--bord);
      border-radius:4px;font-size:13.5px;font-family:inherit}
input[type=range]{width:180px;vertical-align:middle}
.stat{display:inline-block;margin-right:26px}
.stat b{display:block;font-size:22px;font-weight:600}
.stat span{color:#5b6570;font-size:12.5px}
.croise td,.croise th{padding:2px 4px;font-size:11.5px;text-align:center}
.croise th.nom{text-align:left;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.croise select{font-size:11px;padding:1px;border-radius:3px;width:100%;border:1px solid transparent;background:none}
.croise td.p-2{background:#fbdedc}.croise td.p-1{background:#fdf0e3}
.croise td.p1{background:#e3f0e8}.croise td.p2{background:#cce8cc}
td.p-2{background:#fbdedc}td.p2{background:#cce8cc}
.chargement{display:inline-block;width:13px;height:13px;border:2px solid #fff;border-top-color:transparent;
            border-radius:50%;animation:t .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes t{to{transform:rotate(360deg)}}
.regle{padding:5px 0;border-bottom:1px solid #eef0f2;display:flex;gap:10px;align-items:baseline}
.regle code{background:var(--gris);padding:1px 5px;border-radius:3px;font-size:12px;flex-shrink:0}

/* ── Emplois du temps à l'écran ──────────────────────────────────────────────────────────────
   Même grille que les exports : demi-heures fusionnées, semaines A et B côte à côte et réunies
   quand elles portent le même cours. Les en-têtes ne sont pas collants ici, contrairement aux
   autres tableaux : une grille se lit d'un bloc, pas en défilant. */
.edt{border-collapse:collapse;table-layout:fixed;width:100%;background:#fff;margin:4px 0 0}
.edt td,.edt th{border:1px solid #9aa0a6;padding:2px 3px;text-align:center;vertical-align:middle;
  white-space:pre-line;overflow:hidden;font-size:10.5px;line-height:1.25}
.edt th{background:#eef1f4;font-size:11px;position:static;box-shadow:none}
.edt th.ab{background:#f4f6f8;font-weight:400;font-style:italic;font-size:9px}
.edt td.h{background:#f2f4f6;font-weight:600;font-size:9.5px;color:#4a5258}
.edt tr:hover td{background:inherit}
.edt td.cours{cursor:pointer}
.edt td.cours:hover{outline:2px solid var(--bleu);outline-offset:-2px}
.edt td.hors{color:#6b7279}
.edt .verrou{font-size:10px}
.edt .retouche{position:absolute}
.onglets{display:flex;gap:2px;border-bottom:2px solid var(--bord);margin:0 0 16px}
.onglets button{border:0;background:none;padding:9px 16px;font-size:14px;cursor:pointer;
  color:#4a5258;border-bottom:3px solid transparent;margin-bottom:-2px}
.onglets button:hover{color:var(--bleu)}
.onglets button.actif{color:var(--bleu);font-weight:600;border-bottom-color:var(--bleu)}
.legende-edt{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin:0 0 10px}
.legende-edt span{border:1px solid #9aa0a6;border-radius:3px;padding:2px 8px;font-size:11.5px}
.champ{border:1px solid var(--bord);border-radius:4px;padding:5px 7px;font-size:13.5px}
.grille-champs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.grille-champs label{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:#4a5258}
</style>
</head>
<body>
<header>
  <h1>PIAL — Affectation des AESH</h1>
  <div class="projet" id="entete-projet">aucun projet ouvert</div>
</header>
<div class="corps">
  <nav id="nav"></nav>
  <main id="ecran"></main>
</div>

<script>
const ETAPES = [
  ["projet",       "Projet"],
  ["import",       "Import des données"],
  ["etablissement","Établissement"],
  ["semaines",     "Semaines types"],
  ["eleves",       "Élèves & efforts"],
  ["aesh",         "AESH & affinités"],
  ["mutualisation","Mutualisation"],
  ["periodes",     "Stages & CCF"],
  ["ponderations", "Pondérations & règles"],
  ["calcul",       "Calcul"],
  ["resultat",     "Emplois du temps"],
];
let E = {};            // état renvoyé par le serveur
let POP = null;        // population (élèves, AESH, matières) — mise en cache
let etape = "projet";
const $ = (s, r=document) => r.querySelector(s);
// Verrou signifiant « ce cours reste sans accompagnement » — même valeur que côté serveur.
const SANS_ACCOMPAGNEMENT = "__sans__";
const ech = t => String(t ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function api(url, options = {}) {
  const r = await fetch(url, options);
  let corps;
  try { corps = await r.json(); } catch { throw new Error("Réponse illisible du serveur."); }
  if (!r.ok) throw new Error(corps.erreur || "Erreur inconnue");
  return corps;
}
async function majEtat() { E = await api("/api/etat"); dessinerNav(); }

/*
 * Rappel de ce qui vient d'être fabriqué, avec un lien de secours.
 *
 * Un navigateur peut refuser un téléchargement lancé par le code — Safari le fait quand sa liste de
 * téléchargements est en vrac, et l'utilisateur n'a alors aucun moyen de savoir que le fichier
 * existe pourtant, déjà écrit sur le disque. Ce rappel lui donne les deux issues : le lien, qu'il
 * peut cliquer lui-même, et le dossier où le fichier l'attend de toute façon.
 */
function annoncerFichier(pret) {
  const zone = $("#retour-export") || $("#depot-recueil-retour") || $("#retour-projet");
  if (!zone) return;
  const ko = Math.max(1, Math.round(pret.octets / 1024));
  zone.innerHTML = message("info",
    `<b>${ech(pret.fichier)}</b> (${ko} Ko) est prêt.<br>`
    + `Si l'enregistrement n'a pas démarré, `
    + `<a href="${pret.adresse}" download="${ech(pret.fichier)}">cliquez ici</a> — `
    + `le fichier est de toute façon rangé dans le dossier du projet, sous « sorties ».`);
}

/*
 * Téléchargement d'un fichier produit par l'application.
 *
 * En deux temps, et c'est volontaire.
 *
 * Trois façons de faire ont échoué avant celle-ci : « location.href » (c'est une navigation, deux
 * téléchargements lancés coup sur coup s'annulaient), le contenu passé en mémoire par un objet
 * blob (Safari perdait l'objet avant d'avoir fini de l'écrire : « WebKitBlobResource error »), et
 * surtout le fait de fabriquer le fichier dans la requête de téléchargement elle-même — le
 * navigateur redemande l'adresse pour son propre compte et récupérait alors un fichier recalculé,
 * différent du premier, donc inutilisable.
 *
 * On demande donc d'abord la fabrication, qui répond par l'adresse d'un fichier écrit sur le
 * disque, puis on laisse le navigateur télécharger cette adresse comme n'importe quel lien. Elle
 * est stable : il peut la redemander autant de fois qu'il veut.
 */
async function telecharger(url, bouton) {
  const libelle = bouton ? bouton.textContent : "";
  if (bouton) { bouton.disabled = true; bouton.textContent = "Préparation…"; }
  try {
    const pret = await api(url);
    const lien = document.createElement("a");
    lien.href = pret.adresse;
    lien.download = pret.fichier;
    document.body.appendChild(lien);
    lien.click();
    // Safari abandonne le téléchargement si le lien disparaît du document trop tôt.
    setTimeout(() => lien.remove(), 60000);
    annoncerFichier(pret);
    return pret;
  } finally {
    if (bouton) { bouton.disabled = false; bouton.textContent = libelle; }
  }
}
async function enregistrer(champs) { await api("/api/parametres", {method:"POST",
  headers:{"Content-Type":"application/json"}, body: JSON.stringify(champs)}); await majEtat(); }

function dessinerNav() {
  const ouvert = E.ouvert, pial = E.pial?.charge, ics = (E.ics?.fichiers||0) > 0;
  const etab = E.etat?.etablissement, sem = (E.etat?.semaines_types||[]).length > 0;
  // Les disponibilités sont enregistrées soit en grille nue (anciens projets), soit accompagnées
  // de la plage en vigueur lors de la saisie. On accepte les deux formes.
  const lignesDispos = g => Array.isArray(g) ? g : (g?.grille || []);
  const dispo = ouvert && Object.values(E.etat?.dispos || {})
    .some(g => lignesDispos(g).some(l => Array.isArray(l) && l.some(Boolean)));
  const actif = {projet:true, import:ouvert, etablissement:pial, semaines:pial&&ics&&etab,
                 eleves:etab&&sem, aesh:etab&&sem, mutualisation:etab&&sem, periodes:etab&&sem,
                 ponderations:etab&&sem, calcul:dispo,
                 // Accessible dès qu'il y a des emplois du temps : on peut vouloir les corriger
                 // avant le premier calcul, pas seulement relire ce qu'il a produit.
                 resultat: etab&&sem};
  $("#nav").innerHTML = ETAPES.map(([cle, nom], i) =>
    `<button data-e="${cle}" class="${cle===etape?'actif':''}" ${actif[cle]?'':'disabled'}>
       <span class="num">${i+1}</span>${nom}</button>`).join("");
  $("#nav").querySelectorAll("button").forEach(b =>
    b.onclick = () => { etape = b.dataset.e; dessinerNav(); dessiner(); });
  $("#entete-projet").textContent = ouvert
    ? `${E.nom}${etab ? " — " + etab : ""}` : "aucun projet ouvert";
}

function message(type, texte) { return `<div class="msg ${type}">${texte}</div>`; }
function erreurAffichee(e) { return message("err", `<b>Cela n'a pas fonctionné.</b><br>${ech(e.message)}`); }

/* ───────────────────────── Zone de dépôt ───────────────────────── */
function zoneDepot(id, titre, detail, accept, dossier) {
  return `<div class="depot" id="${id}">
     <b>${titre}</b><span>${detail}</span>
     <input type="file" hidden multiple ${dossier?'webkitdirectory':''} accept="${accept}">
   </div><div id="${id}-retour"></div>`;
}
function brancherDepot(id, url, apresEnvoi) {
  const zone = $("#" + id), champ = $("input", zone), retour = $("#" + id + "-retour");
  // Envoi par lots. Un dossier d'exports ProNote dépasse souvent le millier de fichiers, au-delà de
  // ce qu'un seul formulaire accepte. Les lots sont volontairement petits et chacun est réessayé
  // deux fois, puis découpé en deux, avant d'abandonner : un envoi qui échoue ponctuellement ne doit
  // pas faire perdre tout l'import. L'état de l'application n'est rafraîchi qu'à la fin.
  const TAILLE_LOT = 40, ESSAIS = 3;
  const envoyer = async fichiersBruts => {
    if (!fichiersBruts.length) return;
    let fichiers;
    try {
      fichiers = await materialiser(fichiersBruts, (fait, total) => retour.innerHTML = message("info",
        `<span class="chargement" style="border-color:#2b5a8a;border-top-color:transparent"></span>
         Lecture des fichiers : <b>${fait} / ${total}</b>`));
    } catch (e) { retour.innerHTML = erreurAffichee(e); return; }
    const debut = Date.now();
    const cumul = {recus: 0, indexes: 0, nb_ignores: 0, ignores: [], remplaces: 0, conserves: 0};
    let dernier = null;

    const envoyerLot = async (lot, estDernier, profondeur = 0) => {
      const corps = new FormData();
      for (const f of lot) corps.append("fichiers", f, f._chemin || f.webkitRelativePath || f.name);
      for (let essai = 1; essai <= ESSAIS; essai++) {
        try {
          return await api(url + (estDernier ? "?dernier=1" : ""), {method: "POST", body: corps});
        } catch (e) {
          if (essai === ESSAIS) {
            if (lot.length > 1 && profondeur < 3) {       // on découpe : un lot plus court passe souvent
              const milieu = Math.ceil(lot.length / 2);
              await envoyerLot(lot.slice(0, milieu), false, profondeur + 1);
              return await envoyerLot(lot.slice(milieu), estDernier, profondeur + 1);
            }
            throw new Error(`${e.message} (après ${ESSAIS} tentatives sur un lot de ${lot.length} fichier(s))`);
          }
          await new Promise(r => setTimeout(r, 400 * essai));
        }
      }
    };

    for (let debutLot = 0; debutLot < fichiers.length; debutLot += TAILLE_LOT) {
      const lot = fichiers.slice(debutLot, debutLot + TAILLE_LOT);
      const fait = Math.min(debutLot + lot.length, fichiers.length);
      const reste = fait > 20
        ? ` — environ ${Math.max(1, Math.round((Date.now() - debut) / fait * (fichiers.length - fait) / 1000))} s restantes`
        : "";
      retour.innerHTML = message("info",
        `<span class="chargement" style="border-color:#2b5a8a;border-top-color:transparent"></span>
         Import en cours : <b>${fait} / ${fichiers.length}</b> fichier(s)${reste}`);
      try {
        dernier = await envoyerLot(lot, fait >= fichiers.length);
      } catch (e) {
        retour.innerHTML = erreurAffichee(e) + message("avert",
          `<b>${cumul.recus} fichier(s) ont malgré tout été importés.</b> Vous pouvez relancer le
           dépôt : les fichiers déjà présents ne sont pas réimportés en double.`);
        await majEtat();
        return;
      }
      cumul.recus += dernier.recus || 0;
      cumul.indexes = dernier.indexes ?? cumul.indexes;
      cumul.nb_ignores += dernier.nb_ignores || 0;
      cumul.remplaces += dernier.remplaces || 0;
      cumul.conserves += dernier.conserves || 0;
      if (dernier.ignores) cumul.ignores.push(...dernier.ignores);
    }
    await majEtat();
    retour.innerHTML = "";
    apresEnvoi(fichiers.length > TAILLE_LOT
      ? {...dernier, ...cumul, ignores: cumul.ignores.slice(0, 20)} : dernier, retour);
  };
  zone.onclick = () => champ.click();
  champ.onchange = () => envoyer([...champ.files]);
  zone.ondragover = e => { e.preventDefault(); zone.classList.add("survol"); };
  zone.ondragleave = () => zone.classList.remove("survol");
  zone.ondrop = async e => {
    e.preventDefault(); zone.classList.remove("survol");
    const fichiers = [];
    const entrees = [...(e.dataTransfer.items||[])].map(i => i.webkitGetAsEntry?.()).filter(Boolean);
    if (entrees.length) { for (const entree of entrees) await parcourir(entree, fichiers); }
    else fichiers.push(...e.dataTransfer.files);
    envoyer(fichiers);
  };
}
async function parcourir(entree, sortie) {
  if (entree.isFile) return new Promise(r => entree.file(f => {
    // fullPath vaut « /MonDossier/sources/x.ics » : c'est la seule trace du chemin relatif pour un
    // dossier glissé-déposé, webkitRelativePath restant vide dans ce cas.
    try { f._chemin = (entree.fullPath || "").replace(/^\//, "") || f.name; } catch { f._chemin = f.name; }
    sortie.push(f); r();
  }, () => r()));
  const lecteur = entree.createReader();
  while (true) {
    const lot = await new Promise(r => lecteur.readEntries(r, () => r([])));
    if (!lot.length) break;
    for (const e of lot) await parcourir(e, sortie);
  }
}

/*
 * Les fichiers issus d'un glisser-déposer ne restent lisibles qu'un temps : passé quelques
 * aller-retours réseau, le navigateur invalide les références et la lecture échoue — « Load failed »
 * dans Safari, une interruption silencieuse ailleurs. C'était la cause des imports qui s'arrêtaient
 * à 450, 600 ou 1200 fichiers : un point d'arrêt variable parce qu'il dépend du temps écoulé, pas
 * du contenu. On recopie donc tout en mémoire avant le premier envoi.
 */
async function materialiser(fichiers, avancement) {
  const prets = [];
  for (let i = 0; i < fichiers.length; i++) {
    const f = fichiers[i];
    try {
      const contenu = await f.arrayBuffer();
      const copie = new File([contenu], f.name, {type: f.type});
      copie._chemin = f._chemin || f.webkitRelativePath || f.name;
      prets.push(copie);
    } catch (e) {
      throw new Error(`Le fichier « ${f.name} » n'a pas pu être lu (${e.message}). `
        + "Si vous avez glissé un dossier, réessayez en le sélectionnant par le bouton, "
        + "ou déposez plutôt l'archive .zip.");
    }
    if (avancement && (i % 25 === 0 || i === fichiers.length - 1)) avancement(i + 1, fichiers.length);
  }
  return prets;
}

function tableauNotes(lignes, familles, valeurs, defauts, colonneInfos) {
  defauts = defauts || {};
  return `<div class="defile large"><table><tr><th style="min-width:210px">Nom</th>${colonneInfos.map(c=>`<th class="num">${c}</th>`).join("")}
    ${familles.map(f => `<th class="num" title="${ech(f)}${defauts[f]?` — ${defauts[f]} par défaut`:""}" style="writing-mode:vertical-rl;transform:rotate(180deg);height:150px;padding:4px">${ech(f)}</th>`).join("")}</tr>
    ${lignes.map(l => `<tr>${l.cellules ? l.cellules : `<td>${ech(l.nom)}</td>`}${l.infos.map(v=>`<td class="num">${v}</td>`).join("")}
      ${familles.map(f => {
        const saisie = (valeurs[l.id]||{})[f];
        const defaut = defauts[f];
        const v = saisie || "";
        const classe = saisie === 0 ? "exclu" : saisie ? "" : (defaut ? "defaut" : "vide");
        return `<td style="padding:1px"><input class="note ${classe}" data-id="${l.id}" data-f="${ech(f)}"
                 value="${saisie === 0 ? "0" : v}" placeholder="${defaut || ""}" maxlength="1"
                 title="0 = pas d'accompagnement · 1 à 5 = effort · vide = ${defaut ? defaut + " (par défaut)" : "neutre"}"></td>`;}).join("")}</tr>`).join("")}
  </table></div>`;
}
function brancherNotes(valeurs, surChangement) {
  document.querySelectorAll("input.note").forEach(champ => {
    champ.onchange = async () => {
      const v = champ.value.trim();
      if (v && !/^[0-5]$/.test(v)) { champ.value = ""; }
      const id = champ.dataset.id, f = champ.dataset.f;
      valeurs[id] = valeurs[id] || {};
      if (champ.value !== "") valeurs[id][f] = +champ.value; else delete valeurs[id][f];
      const aDefaut = !!champ.placeholder, exclu = champ.value === "0";
      champ.classList.toggle("exclu", exclu);
      champ.classList.toggle("vide", champ.value === "" && !aDefaut);
      champ.classList.toggle("defaut", champ.value === "" && aDefaut);
      await surChangement(valeurs);
      if (exclu || champ.dataset.recharge) { POP = null; }
    };
  });
}

// L'import d'un projet ne peut pas être découpé comme un dépôt ordinaire : un dossier exporté
// « complet » contient des milliers de fichiers, et un seul lot porterait projet.json — tous les
// autres seraient refusés. On crée donc d'abord le projet à partir de projet.json, puis on le
// remplit lot par lot.
function brancherImportProjet() {
  const zone = $("#depot-projet"), champ = $("input", zone), retour = $("#depot-projet-retour");
  const TAILLE_LOT = 60;

  const traiter = async fichiersBruts => {
    if (!fichiersBruts.length) return;
    const chemin = f => f._chemin || f.webkitRelativePath || f.name;
    const dire = t => retour.innerHTML = message("info",
      `<span class="chargement" style="border-color:#2b5a8a;border-top-color:transparent"></span> ${t}`);

    let fichiers;
    try {
      fichiers = await materialiser(fichiersBruts,
        (fait, total) => dire(`Lecture des fichiers : <b>${fait} / ${total}</b>`));
    } catch (e) { retour.innerHTML = erreurAffichee(e); return; }
    const archive = fichiers.find(f => /\.zip$/i.test(f.name));

    try {
      if (archive) {
        dire("Lecture de l'archive…");
        const corps = new FormData();
        corps.append("fichiers", archive, archive.name);
        const r = await api("/api/projets/importer", {method:"POST", body: corps});
        return conclure(r);
      }
      const manifeste = fichiers.find(f => chemin(f).split("/").pop() === "projet.json");
      if (!manifeste) throw new Error(
        "Le dossier déposé ne contient pas de fichier « projet.json ». Déposez le dossier du projet "
        + "lui-même, ou l'archive .zip produite par « Exporter… ».");

      // Le dossier englobant est celui qui contient projet.json : on l'enlève des chemins.
      const morceaux = chemin(manifeste).split("/");
      const prefixe = morceaux.length > 1 ? morceaux[0] : "";

      dire("Création du projet…");
      const premier = new FormData();
      premier.append("fichiers", manifeste, chemin(manifeste));
      const cree = await api("/api/projets/importer", {method:"POST", body: premier});

      const reste = fichiers.filter(f => f !== manifeste);
      for (let i = 0; i < reste.length; i += TAILLE_LOT) {
        const lot = reste.slice(i, i + TAILLE_LOT);
        const fait = Math.min(i + lot.length, reste.length);
        dire(`Copie des fichiers : <b>${fait} / ${reste.length}</b>`);
        const corps = new FormData();
        for (const f of lot) corps.append("fichiers", f, chemin(f));
        const dernier = fait >= reste.length;
        await api(`/api/projets/${encodeURIComponent(cree.nom)}/fichiers`
                  + `?prefixe=${encodeURIComponent(prefixe)}${dernier ? "&dernier=1" : ""}`,
                  {method:"POST", body: corps});
      }
      if (!reste.length) {
        await api(`/api/projets/${encodeURIComponent(cree.nom)}/fichiers`
                  + `?prefixe=${encodeURIComponent(prefixe)}&dernier=1`,
                  {method:"POST", body: new FormData()}).catch(() => {});
      }
      const etat = await api("/api/projets");
      const info = etat.projets.find(p => p.nom === cree.nom) || {};
      conclure({nom: cree.nom, pial: !!info.pial, ics: info.ics || 0});
    } catch (e) { retour.innerHTML = erreurAffichee(e); }
  };

  const conclure = async r => {
    await majEtat();
    retour.innerHTML = message("succes",
      `Projet <b>${ech(r.nom)}</b> importé — fichier PIAL ${r.pial ? "présent" : "<b>absent</b>"},
       ${r.ics} emploi(s) du temps.`
      + (r.ics ? "" : "<br>Redéposez les exports ProNote à l'étape « Import » : tout le reste du "
                      + "travail est conservé."));
    setTimeout(dessiner, 2400);
  };

  zone.onclick = () => champ.click();
  champ.onchange = () => traiter([...champ.files]);
  zone.ondragover = e => { e.preventDefault(); zone.classList.add("survol"); };
  zone.ondragleave = () => zone.classList.remove("survol");
  zone.ondrop = async e => {
    e.preventDefault(); zone.classList.remove("survol");
    const fichiers = [];
    const entrees = [...(e.dataTransfer.items || [])].map(i => i.webkitGetAsEntry?.()).filter(Boolean);
    if (entrees.length) { for (const entree of entrees) await parcourir(entree, fichiers); }
    else fichiers.push(...e.dataTransfer.files);
    traiter(fichiers);
  };
}

function brancherAssociation(apresChoix) {
  document.querySelectorAll("button.associer").forEach(bouton => bouton.onclick = async () => {
    const id = bouton.dataset.id;
    const forces = structuredClone(E.etat.appariements_forces || {});
    const boite = document.createElement("div");
    boite.className = "voile";
    document.body.appendChild(boite);
    const fermer = () => boite.remove();

    const dessinerListe = async recherche => {
      const d = await api(`/api/candidats/${encodeURIComponent(id)}?q=${encodeURIComponent(recherche||"")}`);
      boite.innerHTML = `<div class="fenetre">
        <h3 style="margin:0 0 4px">Associer un emploi du temps</h3>
        <p class="aide" style="margin:0 0 12px">
          <b>${ech(d.eleve)}</b>, né(e) le ${ech(d.dob) || "date inconnue"} —
          choisissez le fichier ProNote correspondant. Les fichiers portant la <b>même date de
          naissance</b> sont proposés en premier ; une date différente n'est pas forcément une erreur
          d'identité, elle peut venir d'une saisie fautive dans l'un des deux fichiers.</p>
        <input type="text" id="recherche-ics" placeholder="Filtrer par nom…" value="${ech(recherche||"")}"
               style="width:100%;margin-bottom:10px">
        <div class="defile"><table>
          <tr><th>Élève dans ProNote</th><th>Né(e) le</th><th class="num">Ressemblance</th><th></th></tr>
          ${d.candidats.map(c => `<tr>
            <td>${ech(c.libelle)}</td>
            <td>${ech(c.dob)} ${c.meme_date ? "<span class='pastille ok'>même date</span>" : ""}</td>
            <td class="num">${Math.round(c.score*100)} %</td>
            <td><button class="action choisir-ics" data-f="${ech(c.fichier)}"
                        style="padding:3px 10px;font-size:12px">Choisir</button></td></tr>`).join("")
            || `<tr><td colspan="4" style="color:#5b6570">Aucun fichier ne correspond à ce filtre.</td></tr>`}
        </table></div>
        <div class="ligne" style="margin:12px 0 0;justify-content:flex-end">
          ${d.force ? `<button class="action secondaire" id="retirer-assoc"
             style="color:#b3261e;border-color:#b3261e;margin-right:auto">Retirer l'association forcée</button>` : ""}
          <button class="action secondaire" id="annuler-assoc">Annuler</button>
        </div></div>`;
      const champ = $("#recherche-ics", boite);
      champ.oninput = () => { clearTimeout(champ._t);
        champ._t = setTimeout(() => dessinerListe(champ.value), 250); };
      champ.focus();
      $("#annuler-assoc", boite).onclick = fermer;
      if ($("#retirer-assoc", boite)) $("#retirer-assoc", boite).onclick = async () => {
        delete forces[id];
        await enregistrer({appariements_forces: forces}); fermer(); apresChoix();
      };
      boite.querySelectorAll(".choisir-ics").forEach(b => b.onclick = async () => {
        forces[id] = b.dataset.f;
        await enregistrer({appariements_forces: forces}); fermer(); apresChoix();
      });
    };
    boite.onclick = e => { if (e.target === boite) fermer(); };
    await dessinerListe("");
  });
}

    ${sansEdt.length ? message("avert", `<b>${sansEdt.length} élève(s) sans emploi du temps</b> :

    ${sansHeures.length ? message("avert", `<b>${sansHeures.length} élève(s) sans heures notifiées</b> :

    <div class="carte">
      <b>Matières retirées de l'accompagnement</b>

      <div class="exclusions">
        ${toutes.map(f => `<label class="${exclues.includes(f)?"retiree":""}">
          <input type="checkbox" class="exclure" value="${ech(f)}"
                 ${exclues.includes(f)?"":"checked"}> ${ech(f)}</label>`).join("")}
      </div>
      ${Object.keys(POP.heures_retirees||{}).length ? message("info",
        "<b>Heures écartées de l'accompagnement :</b> " + Object.entries(POP.heures_retirees)
          .map(([f,h])=>`${ech(f)} ${h} h`).join(" · ")) : ""}

    <div class="carte" style="padding:10px">
      ${tableauNotes(lignes, familles, valeurs, defauts, ["Aide","Notifié","Présence"])}

        ${familles.map(f => `<div style="margin-top:4px"><b>${ech(f)}</b> : ${

  brancherNotes(valeurs, async v => { await enregistrer({efforts: v}); POP = null; });
  document.querySelectorAll("input.exclure").forEach(c => c.onchange = async () => {

    champ.onchange = async () => {
      const v = champ.value.trim().replace(",", ".");
      if (v && isNaN(+v)) { champ.value = ""; return; }
      if (v) heures[champ.dataset.id] = +v; else delete heures[champ.dataset.id];
      await enregistrer({heures_eleves: heures});
      POP = null; dessiner();
    };
  });

  $("#ecran").innerHTML = `
    <h2>AESH & affinités</h2>
    <p class="aide">Notez de <b>1 à 5</b> l'aisance déclarée de chaque AESH par famille de matières
      (vide = neutre). <b>0 signifie un refus</b> : l'accompagnant ne sera jamais placé sur cette
      matière, quoi qu'il arrive. Renseignez ensuite leurs <b>disponibilités</b> : à la main
      ci-dessous, ou en envoyant le classeur de recueil et en le réimportant une fois rempli.</p>

        <span style="color:#5b6570">un onglet par AESH, à envoyer puis à réimporter</span>
      </div>
      ${zoneDepot("depot-recueil","Déposez ici le classeur de recueil rempli","(.xlsx ou .ods)",".xlsx,.ods",false)}
    </div>
    <div class="carte" style="padding:10px">
      <b style="padding-left:6px">Affinités par matière</b>
      ${tableauNotes(POP.aesh.map(a => ({id:a.id, nom:a.nom_complet,
          infos:[(a.quotite||0)+" h", a.dispo_heures+" h"]})), familles, valeurs, {}, ["Quotité","Dispo."])}
    </div>
    <div class="carte">
      <b>Disponibilités</b>
      <div class="ligne" style="margin-top:8px">
        <select id="choix-aesh">${POP.aesh.map(a =>
          `<option value="${a.id}">${ech(a.nom_complet)} — ${a.quotite||0} h de quotité, ${a.dispo_heures} h déclarées</option>`).join("")}</select>
        <button class="action secondaire" id="tout-cocher">Tout cocher</button>
        <button class="action secondaire" id="tout-decocher">Tout effacer</button>
        <span style="color:#5b6570">cliquez ou faites glisser sur la grille</span>
      </div>
      <div id="grille-dispo"></div>
    </div>
    <div class="carte">
      <b>AESH habituel de chaque élève</b>
      <p class="aide" style="margin:6px 0 10px">Utile lorsqu'un élève a l'habitude d'être accompagné
        par la même personne : désignez-la, et le calcul la <b>privilégiera</b>. Passez à
        <b>imposer</b> si ce doit être garanti. Les interdictions se règlent dans le tableau croisé
        de l'écran « Pondérations ».</p>
      <div class="defile"><table>
        <tr><th>Élève</th><th>Aide</th><th class="num">Notifié</th>
            <th style="width:280px">AESH souhaité</th><th style="width:150px">Force</th></tr>
        <tbody id="corps-paires"></tbody>
      </table></div>
    </div>`;
  brancherNotes(valeurs, v => enregistrer({affinites: v}));
  $("#telecharger-recueil").onclick = async e => {
    try { await telecharger("/api/recueil", e.target); }
    catch (err) { $("#depot-recueil-retour").innerHTML = erreurAffichee(err); }
  };
  brancherDepot("depot-recueil", "/api/import/dispos", (r, retour) => {
    retour.innerHTML = message("succes",
      `<b>${r.reconnus.length} AESH</b> relus (${r.affinites} affinité(s)).`
      + (r.reconnus.length ? "<br>" + r.reconnus.map(x=>`${ech(x.nom)} : ${x.heures} h`).join(" · ") : ""))
      + (r.inconnus.length ? message("avert", `Onglets non rattachés : ${ech(r.inconnus.join(", "))}`) : "")
      + (r.vides.length ? message("avert", `Aucune disponibilité cochée pour : ${ech(r.vides.join(", "))}`) : "");
    POP = null; setTimeout(dessiner, 1600);
  });
  const dessinerGrille = async () => {
    const id = $("#choix-aesh").value;
    const d = await api("/api/dispos/" + id);
    const heure = s => { const m = d.h_min*60 + s*E.pas_minutes;
      return `${Math.floor(m/60)}h${String(m%60).padStart(2,"0")}`; };
    $("#grille-dispo").innerHTML = `<table class="grille-dispo" style="width:auto;margin-top:6px">
      <tr><th></th>${E.jours.slice(0,5).map(j=>`<th>${j}</th>`).join("")}</tr>
      ${Array.from({length:d.nb_creneaux}, (_,s) => `<tr><td class="heure">${heure(s)}</td>
        ${d.grille.map((ligne,j)=>`<td class="${ligne[s]?'pris':'libre'}" data-j="${j}" data-s="${s}"></td>`).join("")}</tr>`).join("")}
    </table>`;
    let glisse = false, valeurPose = true;
    const basculer = async (c, forcer) => {
      const j = +c.dataset.j, s = +c.dataset.s;
      d.grille[j][s] = forcer !== undefined ? forcer : !d.grille[j][s];
      c.className = d.grille[j][s] ? "pris" : "libre";
    };
    const sauver = async () => { await api("/api/dispos/"+id, {method:"POST",
      headers:{"Content-Type":"application/json"}, body:JSON.stringify({grille:d.grille})});
      await majEtat(); POP = null; };
    $("#grille-dispo").querySelectorAll("td[data-j]").forEach(c => {
      c.onmousedown = e => { e.preventDefault(); glisse = true;
        valeurPose = !d.grille[+c.dataset.j][+c.dataset.s]; basculer(c, valeurPose); };
      c.onmouseenter = () => { if (glisse) basculer(c, valeurPose); };
    });
    document.onmouseup = () => { if (glisse) { glisse = false; sauver(); } };
    $("#tout-cocher").onclick = () => { d.grille.forEach(l => l.fill(true)); dessinerGrille().then(sauver); };
    $("#tout-decocher").onclick = () => { d.grille.forEach(l => l.fill(false)); sauver().then(dessinerGrille); };
  };
  // Un élève par ligne, et on lui désigne son accompagnant : c'est ainsi que la question se pose
  // sur le terrain. Choisir un AESH vaut « privilégier » — l'intention ordinaire — et la colonne
  // « Force » ne sert qu'à durcir ce choix. Les interdictions restent dans le tableau croisé.
  const paires = structuredClone(E.etat.paires || {});
  const souhaite = e => {
    const trouve = POP.aesh.find(a => (paires[`${a.id}|${e.id}`] || 0) > 0);
    return trouve ? {aesh: trouve.id, force: paires[`${trouve.id}|${e.id}`]} : {aesh: "", force: 1};
  };
  const dessinerPaires = () => {
    $("#corps-paires").innerHTML = POP.eleves.map(e => {
      const {aesh, force} = souhaite(e);
      return `<tr><td>${ech(e.nom_complet)}${e.a_edt ? "" : " <span class='pastille ko'>sans EDT</span>"}</td>
        <td>${e.type_aide || "—"}</td><td class="num">${e.heures || 0} h</td>
        <td class="${aesh ? "p2" : ""}">
          <select class="choix-aesh-eleve" data-e="${e.id}" style="width:100%">
            <option value="">— aucun, le calcul décide —</option>
            ${POP.aesh.map(a => `<option value="${a.id}" ${a.id === aesh ? "selected" : ""}
              >${ech(a.nom_complet)}</option>`).join("")}
          </select></td>
        <td><select class="force-aesh" data-e="${e.id}" ${aesh ? "" : "disabled"} style="width:100%">
            <option value="1" ${force === 1 ? "selected" : ""}>privilégier</option>
            <option value="2" ${force === 2 ? "selected" : ""}>imposer</option>
          </select></td></tr>`;
    }).join("");
    const appliquer = async (idEleve, idAesh, force) => {
      // Un seul AESH souhaité par élève : on efface les autres préférences positives, sans toucher
      // aux interdictions posées ailleurs.
      POP.aesh.forEach(a => {
        const cle = `${a.id}|${idEleve}`;
        if ((paires[cle] || 0) > 0) delete paires[cle];
      });
      if (idAesh) paires[`${idAesh}|${idEleve}`] = force;
      await enregistrer({paires});
    };
    document.querySelectorAll("select.choix-aesh-eleve").forEach(sel => sel.onchange = async () => {
      const forceSel = document.querySelector(`select.force-aesh[data-e="${sel.dataset.e}"]`);
      forceSel.disabled = !sel.value;
      if (sel.value && ![1, 2].includes(+forceSel.value)) forceSel.value = "1";
      sel.parentElement.className = sel.value ? "p2" : "";
      await appliquer(sel.dataset.e, sel.value, +forceSel.value || 1);
    });
    document.querySelectorAll("select.force-aesh").forEach(sel => sel.onchange = async () => {
      const choix = document.querySelector(`select.choix-aesh-eleve[data-e="${sel.dataset.e}"]`);
      if (choix.value) await appliquer(sel.dataset.e, choix.value, +sel.value);
    });
  };
  $("#choix-aesh").onchange = dessinerGrille;
  dessinerGrille(); dessinerPaires();
};

        ${m.eleves.map(e => { const [classe, texte] = effet(e); return `<tr>
          <td>${ech(e.nom)}${e.a_edt?"":" <span class='pastille ko'>sans EDT</span>"}</td>
          <td>${e.type_aide||"—"}</td><td class="num">${e.heures} h</td>
          <td><select class="mode" data-id="${e.id}" style="width:100%">${MODES.map(([v,l])=>
            `<option value="${v}" ${(modes[e.id]||"auto")===v?"selected":""}>${l}</option>`).join("")}</select></td>

        matière). C'est là que la mutualisation peut faire gagner des heures. Marquez
        « incompatibles » deux élèves qu'on ne peut pas regrouper, « à regrouper » ceux qu'il faut
        privilégier.</p>
      ${m.couples.length ? `<div class="defile"><table>
        <tr><th>Élève A</th><th>Élève B</th><th>Aides</th><th class="num">Heures en commun</th>
            <th>Matières</th><th style="width:150px">Décision</th></tr>
        ${m.couples.map(c => { const v = c.reglage; return `<tr>
          <td>${ech(c.nom_a)}</td><td>${ech(c.nom_b)}</td>
          <td>${c.type_a}/${c.type_b}</td>
          <td class="num"><b>${c.heures} h</b></td>
          <td style="font-size:11.5px;color:#4a5258">${ech(c.matieres.join(" · "))}</td>
          <td class="${v<0?'p-2':v>0?'p2':''}"><select class="accord" data-k="${c.a}|${c.b}" style="width:100%">

    if (sel.value === "auto") delete modes[sel.dataset.id]; else modes[sel.dataset.id] = sel.value;

  document.querySelectorAll("select.accord").forEach(sel => sel.onchange = async () => {
    const v = +sel.value;
    if (v) paires[sel.dataset.k] = v; else delete paires[sel.dataset.k];

ECRANS.periodes = async () => {
  const d = await api("/api/periodes");
  const periodes = structuredClone(d.periodes || []);
  const dessine = () => {
    $("#liste-periodes").innerHTML = periodes.length ? periodes.map((p, i) => `
      <div class="carte" style="margin-bottom:10px">
        <div class="ligne">
          <input type="text" class="p-nom" data-i="${i}" value="${ech(p.nom || "")}"
                 placeholder="Nom, ex. PFMP 1" style="width:200px">
          <select class="p-type" data-i="${i}">
            ${Object.entries(d.types).map(([v, l]) =>
              `<option value="${v}" ${p.type === v ? "selected" : ""}>${ech(l)}</option>`).join("")}
          </select>
          du <input type="date" class="p-debut" data-i="${i}" value="${ech(p.debut || "")}">
          au <input type="date" class="p-fin" data-i="${i}" value="${ech(p.fin || "")}">
          <span style="color:#5b6570">${(p.semaines || []).length
            ? "semaines S" + p.semaines.join(", S") : ""}</span>
          <button class="action p-suppr" data-i="${i}"
                  style="margin-left:auto;background:#fff;color:#b3261e;border:1px solid #b3261e">Retirer</button>
        </div>
        <div class="ligne" style="align-items:flex-start">
          <label style="min-width:110px;padding-top:4px">Élèves concernés</label>
          <div class="exclusions" style="flex:1">
            ${d.eleves.map(e => `<label class="${(p.eleves || []).includes(e.id) ? "" : "retiree"}">
              <input type="checkbox" class="p-eleve" data-i="${i}" value="${e.id}"
                     ${(p.eleves || []).includes(e.id) ? "checked" : ""}> ${ech(e.nom)}</label>`).join("")}
          </div>
        </div>
        <div class="ligne">
          <button class="action secondaire p-calc" data-i="${i}">Calculer l'affectation de cette période</button>
          <span>${p.calcule
            ? `<span class="pastille ok">calculée</span> couverture ${p.synthese.taux_global} %,
               plancher ${p.synthese.taux_minimal} %`
            : "<span class='pastille neutre'>pas encore calculée</span>"}</span>
        </div>
      </div>`).join("") : message("info", "Aucune période déclarée.");
    brancher();
  };
  const sauver = async () => {
    await api("/api/periodes", {method:"POST", headers:{"Content-Type":"application/json"},
                                body: JSON.stringify({periodes})});
  };
  const brancher = () => {
    const maj = (classe, champ) => document.querySelectorAll("." + classe).forEach(c =>
      c.onchange = async () => { periodes[+c.dataset.i][champ] = c.value; await sauver();
                                 if (champ === "debut" || champ === "fin") dessiner(); });
    maj("p-nom", "nom"); maj("p-type", "type"); maj("p-debut", "debut"); maj("p-fin", "fin");
    document.querySelectorAll(".p-eleve").forEach(c => c.onchange = async () => {
      const p = periodes[+c.dataset.i];
      p.eleves = [...document.querySelectorAll(`.p-eleve[data-i="${c.dataset.i}"]:checked`)]
        .map(x => x.value);
      c.closest("label").classList.toggle("retiree", !c.checked);
      await sauver();
    });
    document.querySelectorAll(".p-suppr").forEach(b => b.onclick = async () => {
      periodes.splice(+b.dataset.i, 1); await sauver(); dessine();
    });
    document.querySelectorAll(".p-calc").forEach(b => b.onclick = async () => {
      const p = periodes[+b.dataset.i];
      if (!p.debut || !p.fin) { $("#retour-periodes").innerHTML =
        message("err", "Renseignez les dates de début et de fin."); return; }
      b.disabled = true; b.innerHTML = `<span class="chargement" style="border-color:#2b5a8a;border-top-color:transparent"></span>Calcul…`;
      try {
        const r = await api(`/api/periodes/${encodeURIComponent(p.id)}/calculer`,
          {method:"POST", headers:{"Content-Type":"application/json"},
           body: JSON.stringify({exigence: "standard"})});
        const sansEdt = r.periode?.sans_emploi_du_temps || [];
        const ccf = r.synthese?.ccf_impossibles || [];
        if (!r.affectations?.length) {
          $("#retour-periodes").innerHTML = message("err", ech(r.message || r.statut));
        } else {
          let texte = message("succes",
            `<b>${ech(p.nom)}</b> : couverture ${r.synthese.taux_global} %, plancher `
            + `${r.synthese.taux_minimal} %, ${r.aesh.length} AESH mobilisés sur `
            + `${r.eleves.length} élève(s) présents.`);
          if (sansEdt.length) texte += message("avert",
            `<b>${sansEdt.length} élève(s) n'ont aucun cours sur ces semaines</b> dans les exports
             fournis — ${ech(sansEdt.slice(0, 6).join(", "))}${sansEdt.length > 6 ? " …" : ""}.
             Ils ne sont pas pris en compte pour cette période. Si ce ne sont pas des absences
             réelles, c'est que l'export ProNote ne couvre pas ces semaines : réimportez un export
             d'année complète.`);
          if (p.type === "ccf") texte += ccf.length
            ? message("err", `<b>${ccf.length} CCF n'ont pas pu être couverts :</b> `
                + ccf.map(c => `${ech(c.eleve)} — ${ech(c.matiere)}`).join(" · "))
            : message("info", "Tous les CCF de cette période sont couverts.");
          $("#retour-periodes").innerHTML = texte;
        }
        dessiner();
      } catch (e) { $("#retour-periodes").innerHTML = erreurAffichee(e); }
    });
  };
  $("#ecran").innerHTML = `
    <h2>Stages, journées d'intégration &amp; CCF</h2>
    <p class="aide"><b>ProNote n'exporte rien de tout cela</b> — ni les stages, ni les journées
      d'intégration, ni les CCF : les seules catégories exportées sont les cours, les vacances et les
      jours fériés. Ces périodes sont donc à déclarer ici, vous êtes seule à les connaître.</p>
    <p class="aide">Pendant un <b>stage</b> ou une <b>journée d'intégration</b>, les élèves concernés
      ne sont pas accompagnés et leurs AESH sont <b>redistribués sur les autres élèves</b> : chaque
      période reçoit sa propre affectation, qui apparaît sous l'emploi du temps de chaque AESH.
      Un <b>CCF</b> fonctionne à l'inverse : les élèves concernés doivent être accompagnés sur toute
      la durée de l'épreuve, et le calcul le garantit.</p>
    <div class="ligne">
      <button class="action" id="ajouter-periode">Ajouter une période</button>
      <button class="action secondaire" id="detecter-periodes">Proposer d'après les exports ProNote</button>
    </div>
    <div id="propositions"></div>
    <div id="retour-periodes"></div>
    <div id="liste-periodes"></div>`;
  $("#detecter-periodes").onclick = async () => {
    const zone = $("#propositions");
    zone.innerHTML = message("info", `<span class="chargement" style="border-color:#2b5a8a;border-top-color:transparent"></span> Analyse des exports…`);
    try {
      const r = await api("/api/periodes/detecter");
      if (!r.propositions.length) {
        zone.innerHTML = message("info", "Rien de détectable dans les exports fournis.");
        return;
      }
      zone.innerHTML = `<div class="carte">
        <b>Propositions d'après les exports</b>
        <p class="aide" style="margin:6px 0 10px">Ni « stage », ni « PFMP », ni « CCF » n'apparaissent
          dans un export ProNote — vérifié sur 153 771 événements. Ce qui suit est donc déduit :
          les journées d'intégration et les sorties pédagogiques sont <b>lues</b> dans l'export ;
          les absences longues en sont seulement <b>l'indice</b>, le plus souvent un stage.
          Rien n'est appliqué tant que vous n'avez pas ajouté la période.</p>
        <div class="defile"><table>
          <tr><th>Proposition</th><th>Type</th><th>Dates</th><th>Élèves</th><th>D'après</th><th></th></tr>
          ${r.propositions.map((p, i) => `<tr>
            <td>${ech(p.nom)}</td>
            <td>${ech(E.types_periode[p.type] || p.type)}</td>
            <td style="white-space:nowrap">${ech(p.debut)} → ${ech(p.fin)}</td>
            <td style="font-size:12px">${ech(p.noms.slice(0,3).join(", "))}${p.noms.length>3?` (+${p.noms.length-3})`:""}</td>
            <td style="font-size:11.5px;color:#4a5258">${ech(p.origine)}</td>
            <td><button class="action secondaire ajouter-prop" data-i="${i}"
                        style="padding:3px 10px;font-size:12px">Ajouter</button></td></tr>`).join("")}
        </table></div></div>`;
      document.querySelectorAll(".ajouter-prop").forEach(b => b.onclick = async () => {
        const prop = r.propositions[+b.dataset.i];
        periodes.push({id: "p" + Date.now().toString(36) + b.dataset.i, nom: prop.nom,
                       type: prop.type, debut: prop.debut, fin: prop.fin, eleves: prop.eleves});
        await sauver(); dessine();
        b.disabled = true; b.textContent = "Ajoutée";
      });
    } catch (e) { zone.innerHTML = erreurAffichee(e); }
  };
  $("#ajouter-periode").onclick = async () => {
    periodes.push({id: "p" + Date.now().toString(36), nom: "", type: "stage",
                   debut: "", fin: "", eleves: []});
    await sauver(); dessine();
  };
  dessine();
};

/*
 * Écran des emplois du temps : trois vues sur le même travail.
 *
 * On y voit la grille des élèves — la seule qu'on modifie, parce qu'on y a sous les yeux tout ce
 * qu'on déplace —, celle des AESH, et la synthèse chiffrée avec les exports. Le choix de la vue
 * survit aux allers-retours dans le menu.
 */
const EDT = {vue: "eleves", eleve: null, aesh: null, donnees: {}};

ECRANS.resultat = async () => {
  $("#ecran").innerHTML = `
    <h2>Emplois du temps</h2>
    <div id="alerte-perime"></div>
    <div class="onglets">
      ${[["eleves","Élèves"],["aesh","AESH"],["synthese","Synthèse & exports"]].map(([c,n]) =>
        `<button data-v="${c}" class="${EDT.vue===c?"actif":""}">${n}</button>`).join("")}
    </div>
    <div id="contenu-edt"><p class="aide">Chargement…</p></div>`;
  document.querySelectorAll(".onglets button").forEach(b => b.onclick = () => {
    EDT.vue = b.dataset.v; dessiner();
  });
  alertePerime();
  if (EDT.vue === "eleves") return vueElevesEDT();
  if (EDT.vue === "aesh") return vueAeshEDT();
  return vueSynthese();
};

function alertePerime() {
  const zone = $("#alerte-perime");
  if (!zone) return;
  zone.innerHTML = E.etat?.resultat_perime ? message("avert",
    `<b>Le calcul ne tient pas encore compte de vos dernières modifications.</b>
     Verrous et corrections d'emploi du temps ne s'appliquent qu'au calcul suivant.
     <button class="action" id="relancer-perime" style="margin-left:10px">Relancer le calcul</button>`) : "";
  const bouton = $("#relancer-perime");
  if (bouton) bouton.onclick = () => { etape = "calcul"; dessinerNav(); dessiner(); };
}

async function vueSynthese() {
  const r = await api("/api/resultat");
  if (!r.affectations?.length) {
    $("#contenu-edt").innerHTML = message("info", "Aucun calcul n'a encore abouti."); return; }
  const s = r.synthese;
  const pastille = t => t === null ? `<span class="pastille neutre">—</span>`
    : `<span class="pastille ${t>=85?"ok":t>=65?"attention":"ko"}">${t} %</span>`;
  $("#contenu-edt").innerHTML = `
    <p class="aide">Calculé le ${ech((r.calcule_le||"").replace("T"," "))} — statut
      <b>${r.statut === "OPTIMAL" ? "optimal" : "meilleure solution trouvée dans le temps imparti"}</b>.</p>

/* ── Grille hebdomadaire ─────────────────────────────────────────────────────────────────────
 *
 * Les blocs arrivent déjà fusionnés du serveur — demi-heures consécutives réunies, semaines A et B
 * réunies quand elles portent le même cours. C'est le même découpage que les exports, volontairement :
 * ce qu'on corrige à l'écran doit se retrouver tel quel à l'impression.
 */
function heureCreneau(ent, s) {
  const m = ent.h_min * 60 + s * ent.pas_minutes;
  return `${Math.floor(m / 60)}h${String(m % 60).padStart(2, "0")}`;
}

function grilleHTML(blocs, ent, rendre) {
  const occupees = new Set(), depart = new Map();
  blocs.forEach((b, i) => {
    depart.set(`${b.debut}:${b.jour}:${b.colonne}`, [b, i]);
    for (let l = b.debut; l < b.debut + b.hauteur; l++)
      for (let k = 0; k < b.largeur; k++)
        if (!(l === b.debut && k === 0)) occupees.add(`${l}:${b.jour}:${b.colonne + k}`);
  });
  // La plage du projet peut aller de 7 h à 22 h alors que les cours tiennent de 8 h à 18 h :
  // on n'affiche pas une heure vide, elle n'apprend rien et éloigne le reste.
  let premier = 0, dernier = ent.nb_creneaux - 1;
  if (blocs.length) {
    premier = Math.min(...blocs.map(b => b.debut));
    dernier = Math.max(...blocs.map(b => b.debut + b.hauteur - 1));
  }
  const largeur = (88 / (ent.jours.length * 2)).toFixed(3);
  let h = `<table class="edt"><colgroup><col style="width:70px">`
        + `<col style="width:${largeur}%">`.repeat(ent.jours.length * 2)
        + `</colgroup><tr><th rowspan="2">Horaires</th>`
        + ent.jours.map(j => `<th colspan="2">${ech(j)}</th>`).join("")
        + `</tr><tr>`
        + ent.jours.map(() => `<th class="ab">sem. A</th><th class="ab">sem. B</th>`).join("")
        + `</tr>`;
  for (let s = premier; s <= dernier; s++) {
    h += `<tr><td class="h">${heureCreneau(ent, s)}</td>`;
    for (let jour = 0; jour < ent.jours.length; jour++)
      for (const colonne of [0, 1]) {
        if (occupees.has(`${s}:${jour}:${colonne}`)) continue;
        const trouve = depart.get(`${s}:${jour}:${colonne}`);
        if (!trouve) { h += "<td></td>"; continue; }
        const [b, i] = trouve, rendu = rendre(b, i);
        h += `<td${b.hauteur > 1 ? ` rowspan="${b.hauteur}"` : ""}`
           + `${b.largeur > 1 ? ` colspan="${b.largeur}"` : ""}`
           + ` ${rendu.attributs || ""} style="${rendu.style || ""}">${rendu.contenu}</td>`;
      }
    h += "</tr>";
  }
  return h + "</table>";
}

function legendeHTML(couleurs, noms, sansAccompagnement) {
  const entrees = Object.entries(couleurs)
    .map(([id, c]) => [noms[id] || id, c]).sort((a, b) => a[0].localeCompare(b[0], "fr"));
  return `<div class="legende-edt">`
    + entrees.map(([nom, c]) => `<span style="background:#${c}">${ech(nom)}</span>`).join("")
    + (sansAccompagnement
        ? `<span style="background:#E8EAED">sans accompagnement</span>`
          + `<span style="background:#F4F5F6;color:#6b7279">hors accompagnement</span>` : "")
    + `</div>`;
}

/* ── Volet d'un cours : qui l'accompagne, et le cours lui-même ─────────────────────────────── */

async function panneauCours(eleve, bloc, ent) {
  const creation = !bloc;
  const duree = bloc ? bloc.hauteur / 2 : 1;
  const creneaux = [];
  for (let s = 0; s < ent.nb_creneaux; s++) creneaux.push([s, heureCreneau(ent, s)]);

  let cours = null;
  if (bloc && !bloc.motif) {
    try { cours = await api("/api/cours?cle=" + encodeURIComponent(bloc.cles[0])); }
    catch (e) { cours = null; }
  }

  const boite = document.createElement("div");
  boite.className = "voile";
  const semaines = creation ? "" : (bloc.parites.length === 2 ? "semaines A et B"
                                                             : "semaine " + bloc.parites[0]);
  boite.innerHTML = `<div class="fenetre">
    <h3 style="margin:0 0 4px">${creation ? "Ajouter un cours" : ech(bloc.matiere)}</h3>
    <p class="aide" style="margin:0 0 14px">${ech(eleve.nom)}${creation ? "" : ` — ${ent.jours[bloc.jour]}
      ${heureCreneau(ent, bloc.debut)}–${heureCreneau(ent, bloc.debut + bloc.hauteur)}, ${semaines}`}</p>
    <div id="retour-panneau"></div>

    ${creation ? "" : `<div class="carte" style="margin-bottom:14px">
      <b>Accompagnement</b>
      ${bloc.motif ? `<p class="aide" style="margin:6px 0 0">Ce cours n'est pas accompagné :
          <b>${ech(bloc.motif)}</b>. Revenez sur ce choix dans « Élèves &amp; efforts » ou
          « Pondérations &amp; règles » pour pouvoir y affecter quelqu'un.</p>`
        : `<p class="aide" style="margin:6px 0 10px">Choisir quelqu'un — ou « personne » — <b>verrouille</b>
             ce cours : le calcul suivant devra s'y plier. « Libre » signifie que l'AESH n'a rien à
             ce moment-là ; « occupé » qu'il faudra déplacer ce qu'il y fait.</p>
           <select id="panneau-aesh" style="width:100%;padding:7px;font-size:14px">
             <option value="">— laisser le calcul décider —</option>
             ${bloc.aesh ? `<option value="${ech(bloc.aesh)}" ${bloc.verrou === bloc.aesh ? "selected" : ""}>
                🔒 ${ech(bloc.aesh_nom)} — garder cette affectation</option>` : ""}
             ${(cours?.alternatives || []).map(a => `<option value="${ech(a.id)}"
                ${bloc.verrou === a.id ? "selected" : ""}>🔒 ${ech(a.nom)}${a.libre ? " — libre"
                : " — occupé par " + ech(a.occupe_par.join(", "))}</option>`).join("")}
             <option value="${SANS_ACCOMPAGNEMENT}" ${bloc.verrou === SANS_ACCOMPAGNEMENT ? "selected" : ""}>
               🔒 personne — assumer ce cours sans accompagnement</option>
           </select>
           ${!cours ? message("avert", "Les remplaçants possibles n'ont pas pu être chargés.") : ""}
           ${cours && !cours.alternatives.length ? `<p class="aide" style="margin:8px 0 0">Aucun autre
              AESH n'est disponible sur toute la durée de ce cours.</p>` : ""}`}
    </div>`}

    <div class="carte" style="margin-bottom:14px">
      <b>${creation ? "Le cours à ajouter" : "Le cours"}</b>
      <p class="aide" style="margin:6px 0 10px">${creation
        ? "Un cours ajouté n'existe que dans ce projet : il ne remonte pas dans ProNote."
        : "Corrige l'emploi du temps quand ProNote ne reflète plus la réalité. La correction est "
          + "conservée et se réapplique après chaque nouvel import."}
        La <b>famille de matières</b> décide de l'effort demandé à l'élève et des affinités des AESH ;
        sans elle un cours ajouté serait classé « à classer », donc écarté de l'accompagnement. Elle
        vaut pour cet intitulé partout dans le projet.</p>
      <div class="grille-champs">
        <label>Matière<input class="champ" id="p-matiere"
          value="${creation ? "" : ech(bloc.matiere)}" placeholder="intitulé du cours"></label>
        <label>Salle<input class="champ" id="p-salle" value="${creation ? "" : ech(bloc.salle)}"></label>
        <label>Famille de matières<select class="champ" id="p-famille">
          ${(E.familles || []).map(f => `<option value="${ech(f)}"
            ${!creation && bloc.famille === f ? "selected" : ""}>${ech(f)}</option>`).join("")}
        </select></label>
        <label>Jour<select class="champ" id="p-jour">
          ${ent.jours.map((j, i) => `<option value="${i}" ${!creation && bloc.jour === i ? "selected" : ""}>
            ${ech(j)}</option>`).join("")}</select></label>
        <label>Début<select class="champ" id="p-debut">
          ${creneaux.map(([s, t]) => `<option value="${s}" ${!creation && bloc.debut === s ? "selected" : ""}>
            ${t}</option>`).join("")}</select></label>
        <label>Durée<select class="champ" id="p-duree">
          ${Array.from({length: 20}, (_, k) => (k + 1) / 2).map(h => `<option value="${h}"
            ${duree === h ? "selected" : ""}>${h} h</option>`).join("")}</select></label>
        ${creation ? `<label>Semaines<select class="champ" id="p-parites">
          <option value="AB">A et B (toutes les semaines)</option>
          <option value="A">semaine A seulement</option>
          <option value="B">semaine B seulement</option></select></label>` : ""}
      </div>
    </div>

    <div class="ligne" style="justify-content:space-between">
      <div class="ligne">
        ${creation ? "" : `<button class="action secondaire" id="p-supprimer"
            style="color:var(--rouge);border-color:var(--rouge)">Supprimer ce cours</button>`}
        ${!creation && (bloc.retouche || bloc.ajoute) ? `<button class="action secondaire"
            id="p-annuler-retouche">Revenir à ProNote</button>` : ""}
      </div>
      <div class="ligne">
        <button class="action secondaire" id="p-fermer">Fermer</button>
        <button class="action" id="p-enregistrer">${creation ? "Ajouter" : "Enregistrer"}</button>
      </div>
    </div></div>`;
  document.body.appendChild(boite);
  const fermer = () => boite.remove();
  const echec = e => $("#retour-panneau", boite).innerHTML = erreurAffichee(e);
  const recharger = async () => { fermer(); await majEtat(); dessiner(); };

  $("#p-fermer", boite).onclick = fermer;
  boite.onclick = e => { if (e.target === boite) fermer(); };

  const selecteur = $("#panneau-aesh", boite);
  if (selecteur) selecteur.onchange = async () => {
    try {
      await api("/api/imposer", {method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({cours: bloc.cles, aesh: selecteur.value || null})});
      await recharger();
    } catch (e) { echec(e); }
  };

  $("#p-enregistrer", boite).onclick = async () => {
    const valeurs = {
      matiere: $("#p-matiere", boite).value.trim(),
      salle: $("#p-salle", boite).value.trim(),
      jour: +$("#p-jour", boite).value,
      debut: +$("#p-debut", boite).value,
      duree: Math.round(+$("#p-duree", boite).value * 2),
      famille: $("#p-famille", boite).value,
    };
    const parites = creation ? ($("#p-parites", boite).value === "AB" ? ["A", "B"]
                                                                     : [$("#p-parites", boite).value]) : null;
    try {
      await api("/api/retouches", {method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({eleve: eleve.id, action: creation ? "ajouter" : "modifier",
                              cles: creation ? [] : bloc.cles_retouche, valeurs, parites})});
      await recharger();
    } catch (e) { echec(e); }
  };

  const supprimer = $("#p-supprimer", boite);
  if (supprimer) supprimer.onclick = async () => {
    try {
      await api("/api/retouches", {method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({eleve: eleve.id, action: "supprimer", cles: bloc.cles_retouche})});
      await recharger();
    } catch (e) { echec(e); }
  };

  const annuler = $("#p-annuler-retouche", boite);
  if (annuler) annuler.onclick = async () => {
    try {
      await api("/api/retouches", {method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({eleve: eleve.id, action: "annuler", cles: bloc.cles_retouche})});
      await recharger();
    } catch (e) { echec(e); }
  };
}

/* ── Vue « AESH » : lecture seule ──────────────────────────────────────────────────────────── */

async function vueAeshEDT() {
  const d = EDT.donnees.aesh = await api("/api/tableau/aesh");
  const zone = $("#contenu-edt");
  if (!d.aesh.length) {
    zone.innerHTML = message("info", "Aucun AESH actif dans ce projet."); return; }
  if (!d.aesh.some(a => a.id === EDT.aesh)) EDT.aesh = d.aesh[0].id;
  const personne = d.aesh.find(a => a.id === EDT.aesh);
  const index = d.aesh.indexOf(personne);
  const noms = {};
  (EDT.donnees.eleves?.eleves || []).forEach(e => noms[e.id] = e.nom);
  personne.blocs.forEach(b => b.eleves.forEach(e => noms[e.id] = e.nom));

  zone.innerHTML = `
    <div class="carte">
      <div class="ligne">
        <button class="action secondaire" id="aesh-prec" ${index === 0 ? "disabled" : ""}>◀</button>
        <select id="edt-aesh" style="min-width:290px;font-size:15px;padding:6px">
          ${d.aesh.map(a => `<option value="${ech(a.id)}" ${a.id === EDT.aesh ? "selected" : ""}>
            ${ech(a.nom)}</option>`).join("")}
        </select>
        <button class="action secondaire" id="aesh-suiv"
          ${index === d.aesh.length - 1 ? "disabled" : ""}>▶</button>
        <span style="color:#5b6570">quotité <b>${personne.quotite ?? "?"} h</b> —
          <b>${personne.heures_affectees} h</b> affectées —
          ${personne.heures_disponibles} h déclarées disponibles —
          ${personne.eleves.length} élève(s)</span>
      </div>
      <p class="aide" style="margin:10px 0 0">Vue de lecture : les affectations se modifient dans
        l'onglet « Élèves », où l'on voit la journée entière de l'élève qu'on déplace.</p>
      ${legendeHTML(d.couleurs, noms, false)}
      <div id="grille-aesh"></div>
    </div>`;

  $("#grille-aesh").innerHTML = grilleHTML(personne.blocs, d, b => {
    const teintes = [...new Set(b.eleves.map(e => "#" + e.couleur))];
    const style = teintes.length === 1 ? `background:${teintes[0]}`
      : `background:repeating-linear-gradient(135deg,${teintes.map((t, i) =>
          `${t} ${i * 14}px ${(i + 1) * 14}px`).join(",")})`;
    return {contenu: ech(b.eleves.map(e =>
      [e.nom, e.matiere, e.salle].filter(Boolean).join("\n")).join("\n— — —\n")), style};
  });

  const aller = id => { EDT.aesh = id; dessiner(); };
  $("#edt-aesh").onchange = e => aller(e.target.value);
  $("#aesh-prec").onclick = () => aller(d.aesh[index - 1].id);
  $("#aesh-suiv").onclick = () => aller(d.aesh[index + 1].id);
}

async function dessiner() {
  $("#ecran").innerHTML = `<p class="aide">Chargement…</p>`;
  try { await ECRANS[etape](); }
  catch (e) { $("#ecran").innerHTML = `<h2>${ETAPES.find(x=>x[0]===etape)[1]}</h2>` + erreurAffichee(e); }
}
(async () => { await majEtat(); dessiner(); })();
</script>
