name: Application Windows

# Compile l'exécutable Windows. PyInstaller ne sachant pas produire un binaire Windows depuis
# macOS ou Linux, la compilation se fait ici, sur une machine Windows fournie par GitHub.
#
#   · à chaque poussée sur main : l'exécutable est déposé en « artefact » (téléchargeable 90 jours)
#   · à chaque étiquette v*     : il est en plus publié dans une « Release », avec un lien stable

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  construire:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Vérifier que l'application démarre
        run: |
          python -c "import pial_aesh.serveur, pial_aesh.affectation, pial_aesh.tableau, webview; from ortools.sat.python import cp_model; print('modules OK')"

      - name: Compiler
        run: pyinstaller --clean --noconfirm empaqueter/pial_aesh.spec

      - name: Vérifier que l'exécutable répond
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\PIAL-Affectation-AESH.exe `
                             -ArgumentList "--sans-interface","--port","8799" -PassThru
          Start-Sleep -Seconds 25
          try {
            $r = Invoke-WebRequest -Uri http://127.0.0.1:8799/api/etat -UseBasicParsing -TimeoutSec 20
            if ($r.StatusCode -ne 200) { throw "réponse $($r.StatusCode)" }
            Write-Host "L'exécutable démarre et répond."
          } finally { Stop-Process -Id $p.Id -Force }

      - uses: actions/upload-artifact@v4
        with:
          name: PIAL-Affectation-AESH-windows
          path: |
            dist/PIAL-Affectation-AESH.exe
            GUIDE_APPLICATION.md

      - name: Publier dans une Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PIAL-Affectation-AESH.exe
          body: |
            Application « PIAL — Affectation des AESH » pour Windows.

            Téléchargez `PIAL-Affectation-AESH.exe` et double-cliquez dessus : rien à installer,
            ni Python ni dépendance. L'application s'ouvre dans **une seule fenêtre** — pas de
            fenêtre noire, pas de navigateur à côté. Fermer la fenêtre arrête l'application.

            L'affichage utilise le moteur d'Edge (WebView2), présent d'origine sur Windows 11 et
            installé par Edge sur Windows 10. S'il manque, l'interface s'ouvre dans le navigateur
            par défaut plutôt que d'échouer.

            Au premier lancement, Windows SmartScreen peut afficher un avertissement parce que le
            fichier n'est pas signé : « Informations complémentaires » puis « Exécuter quand même ».

            Mode d'emploi complet : [GUIDE_APPLICATION.md](GUIDE_APPLICATION.md).
